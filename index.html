<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#f8fafc; color:#1e293b; min-height:100vh; }
.container { max-width:900px; margin:0 auto; padding:48px 24px; }
header { text-align:center; margin-bottom:48px; }
header h1 { font-size:36px; font-weight:700; color:#0f172a; margin-bottom:8px; }
header p { color:#64748b; font-size:16px; }
.pdf-list { display:flex; flex-direction:column; gap:14px; }
.pdf-item { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:22px 24px; display:flex; align-items:center; gap:18px; transition:all .3s ease; text-decoration:none; color:inherit; }
.pdf-item:hover { border-color:#3b82f6; box-shadow:0 10px 30px rgba(59,130,246,0.08); transform:translateY(-2px); }
.pdf-icon-box { width:52px; height:52px; background:#fef2f2; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
.pdf-details { flex:1; min-width:0; }
.pdf-title { font-size:17px; font-weight:600; color:#0f172a; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pdf-desc { font-size:14px; color:#64748b; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.pdf-meta { display:flex; align-items:center; gap:16px; color:#94a3b8; font-size:13px; flex-shrink:0; }
.pdf-meta span { display:flex; align-items:center; gap:4px; }
.arrow { color:#cbd5e1; font-size:20px; transition:all .2s; }
.pdf-item:hover .arrow { color:#3b82f6; transform:translateX(4px); }
.badge-new { background:#dbeafe; color:#2563eb; font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; margin-left:8px; }
.empty { text-align:center; padding:80px 24px; color:#94a3b8; }
.empty svg { width:64px; height:64px; margin-bottom:16px; opacity:.4; }
.loading { text-align:center; padding:60px; color:#94a3b8; }
.spinner { display:inline-block; width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:#3b82f6; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media(max-width:640px) { .pdf-item { flex-direction:column; align-items:flex-start; } .pdf-meta { width:100%; justify-content:space-between; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Documents PDF</h1>
    <p>Consultez et telechargez nos documents</p>
  </header>
  <div id="list" class="pdf-list">
    <div class="loading"><div class="spinner"></div><p style="margin-top:12px;">Chargement...</p></div>
  </div>
</div>

<script type="module">
// ==================== CONFIGURATION ====================
// Remplacez ces 2 valeurs par celles de votre projet Supabase
const SUPABASE_URL = 'https://wxncjpvglvxsfskfsqey.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_0Wui3p23IR6igGQbmjjYnw_r9xBHuv6
// =======================================================

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function load() {
  const container = document.getElementById('list');
  try {
    const { data:pdfs, error } = await supabase.from('pdfs').select('*').order('uploaded_at',{ascending:false});
    if (error) throw error;
    if (!pdfs || !pdfs.length) {
      container.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><h3>Aucun document disponible</h3></div>`;
      return;
    }
    const fmtSize = b => { if(!b)return'0 B'; const k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(b)/Math.log(k)); return parseFloat((b/Math.pow(k,i)).toFixed(1))+' '+s[i]; };
    const fmtDate = i => { const d=new Date(i); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}); };
    const isNew = i => (new Date()-new Date(i)) < 7*24*60*60*1000;
    const esc = t => { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; };
    container.innerHTML = pdfs.map(p => `
      <a href="${p.public_url}" target="_blank" class="pdf-item">
        <div class="pdf-icon-box">&#128196;</div>
        <div class="pdf-details">
          <div class="pdf-title">${esc(p.title)}${isNew(p.uploaded_at)?'<span class="badge-new">Nouveau</span>':''}</div>
          ${p.description?`<div class="pdf-desc">${esc(p.description)}</div>`:''}
        </div>
        <div class="pdf-meta">
          <span>&#128230; ${fmtSize(p.size)}</span>
          <span>&#128197; ${fmtDate(p.uploaded_at)}</span>
          <span class="arrow">&rarr;</span>
        </div>
      </a>
    `).join('');
  } catch(e) {
    container.innerHTML = `<div class="empty"><p>Erreur de chargement. Verifiez la configuration Supabase.</p><p style="font-size:12px;color:#cbd5e1;margin-top:8px;">${esc(e.message||'')}</p></div>`;
  }
}
load();
</script>
</body>
</html>
