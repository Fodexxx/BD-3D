<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FodeXxx</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#0a0a0f; color:#e8e8ec; min-height:100vh; }
.container { max-width:1200px; margin:0 auto; padding:0 20px; }
header { padding:20px 0; border-bottom:1px solid #1a1a24; position:sticky; top:0; background:rgba(10,10,15,0.95); backdrop-filter:blur(20px); z-index:100; }
.header-inner { display:flex; justify-content:space-between; align-items:center; }
.logo { font-size:24px; font-weight:900; background:linear-gradient(135deg,#ff6b6b,#feca57); -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:-1px; }
.logo span { font-weight:300; color:#666; -webkit-text-fill-color:#666; }
.nav-links { display:flex; gap:28px; align-items:center; }
.nav-links a { color:#888; text-decoration:none; font-size:14px; font-weight:500; transition:color .3s; }
.nav-links a:hover { color:#fff; }
.hero { padding:60px 0 40px; text-align:center; }
.hero h1 { font-size:42px; font-weight:800; line-height:1.1; margin-bottom:16px; letter-spacing:-1.5px; }
.hero h1 .grad { background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.hero p { font-size:17px; color:#777; max-width:500px; margin:0 auto 32px; line-height:1.6; }
.search-box { max-width:480px; margin:0 auto 40px; position:relative; }
.search-box input { width:100%; background:#14141f; border:1px solid #2a2a3a; border-radius:14px; padding:14px 20px 14px 48px; color:#e8e8ec; font-size:15px; font-family:inherit; outline:none; transition:all .3s; }
.search-box input:focus { border-color:#ff6b6b; box-shadow:0 0 0 4px rgba(255,107,107,0.1); }
.search-box::before { content:"🔍"; position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:16px; opacity:.5; }
.filters { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:40px; }
.filter-btn { background:#14141f; border:1px solid #2a2a3a; color:#888; padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; transition:all .3s; }
.filter-btn:hover, .filter-btn.active { background:#ff6b6b; border-color:#ff6b6b; color:#fff; }
.series-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:24px; padding-bottom:80px; }
.series-card { background:#14141f; border:1px solid #1f1f2e; border-radius:20px; overflow:hidden; transition:all .4s cubic-bezier(0.175,0.885,0.32,1.275); cursor:pointer; position:relative; }
.series-card:hover { transform:translateY(-8px); border-color:#2a2a3a; box-shadow:0 30px 60px rgba(0,0,0,0.5); }
.series-card:hover .cover-img { transform:scale(1.08); }
.series-card:hover .read-btn { opacity:1; transform:translateY(0); }
.cover-wrap { height:340px; position:relative; overflow:hidden; }
.cover-img { width:100%; height:100%; object-fit:cover; transition:transform .6s ease; }
.cover-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(10,10,15,0.95) 0%,transparent 60%); }
.cover-badge { position:absolute; top:12px; left:12px; background:rgba(255,107,107,0.9); color:#fff; font-size:11px; font-weight:700; padding:5px 12px; border-radius:8px; backdrop-filter:blur(10px); }
.cover-rating { position:absolute; top:12px; right:12px; background:rgba(0,0,0,0.5); color:#feca57; font-size:12px; font-weight:700; padding:5px 10px; border-radius:8px; backdrop-filter:blur(10px); display:flex; align-items:center; gap:4px; }
.read-btn { position:absolute; bottom:16px; left:50%; transform:translateX(-50%) translateY(10px); background:#ff6b6b; color:#fff; border:none; padding:12px 28px; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer; opacity:0; transition:all .4s ease; white-space:nowrap; }
.card-info { padding:18px 20px 20px; }
.card-title { font-size:16px; font-weight:700; color:#fff; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-meta { display:flex; justify-content:space-between; align-items:center; }
.card-chapters { font-size:13px; color:#666; }
.card-status { font-size:11px; font-weight:700; padding:4px 10px; border-radius:6px; }
.status-ongoing { background:#2a2a1a; color:#feca57; }
.empty { text-align:center; padding:100px 20px; color:#555; }
.empty-icon { font-size:64px; margin-bottom:20px; opacity:.3; }
footer { border-top:1px solid #1a1a24; padding:40px 0; text-align:center; color:#444; font-size:13px; }
footer a { color:#666; text-decoration:none; margin:0 12px; }
footer a:hover { color:#ff6b6b; }
.loading-wrap { text-align:center; padding:100px 20px; }
.spinner { display:inline-block; width:40px; height:40px; border:3px solid #1a1a24; border-top-color:#ff6b6b; border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(12px); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
.modal-bg.active { display:flex; }
.modal-box { background:#14141f; border:1px solid #2a2a3a; border-radius:24px; max-width:420px; width:100%; overflow:hidden; }
.modal-cover { height:220px; position:relative; }
.modal-cover img { width:100%; height:100%; object-fit:cover; }
.modal-cover::after { content:''; position:absolute; inset:0; background:linear-gradient(to top,#14141f,transparent); }
.modal-body { padding:24px; }
.modal-title { font-size:22px; font-weight:800; margin-bottom:8px; }
.modal-desc { font-size:14px; color:#888; line-height:1.6; margin-bottom:20px; }
.modal-actions { display:flex; gap:10px; }
.modal-btn { flex:1; padding:14px; border-radius:12px; font-weight:700; font-size:14px; border:none; cursor:pointer; text-align:center; text-decoration:none; transition:all .3s; }
.modal-btn.primary { background:#ff6b6b; color:#fff; }
.modal-btn.primary:hover { background:#ff5252; }
.modal-btn.secondary { background:#1f1f2e; color:#888; }
.modal-btn.secondary:hover { background:#2a2a3a; color:#fff; }
@media(max-width:640px) {
  .hero h1 { font-size:28px; }
  .series-grid { grid-template-columns:repeat(2,1fr); gap:12px; }
  .cover-wrap { height:240px; }
  .nav-links { display:none; }
}
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <div class="logo">BD<span>3D</span></div>
    <nav class="nav-links">
      <a href="/">Accueil</a>
      <a href="/admin/">Admin</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>Decouvre les <span class="grad">meilleures BD 3D</span></h1>
    <p>Des series exclusives en format PDF, mises a jour regulierement. Lis-les gratuitement.</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher une serie...">
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="filterSeries('all')">Toutes</button>
      <button class="filter-btn" onclick="filterSeries('new')">Nouveautes</button>
      <button class="filter-btn" onclick="filterSeries('popular')">Populaires</button>
    </div>
  </div>
</section>

<main class="container">
  <div id="seriesGrid" class="series-grid">
    <div class="loading-wrap"><div class="spinner"></div><p style="margin-top:16px;color:#444;">Chargement des series...</p></div>
  </div>
</main>

<div class="modal-bg" id="modal" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-cover"><img id="modalImg" src="" alt=""></div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle">Titre</div>
      <div class="modal-desc" id="modalDesc">Description</div>
      <div class="modal-actions">
        <a id="modalRead" href="#" target="_blank" class="modal-btn primary">📖 Lire le PDF</a>
        <button class="modal-btn secondary" onclick="closeModal()">Fermer</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <p>© 2026 BD 3D Store. Tous droits reserves.</p>
    <p style="margin-top:8px;"><a href="/admin/">Panel Admin</a></p>
  </div>
</footer>

<script type="module">
const SUPABASE_URL = 'https://wxncjpvglvxsfskfsqey.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_0Wui3p23IR6igGQbmjjYnw_r9xBHuv6

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allSeries = [];

function generateCover(title, id) {
  const hues = [0, 25, 45, 120, 180, 220, 280, 320];
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
  const hue1 = hues[Math.abs(hash) % hues.length];
  const hue2 = (hue1 + 40) % 360;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="hsl(${hue1},70%,30%)"/><stop offset="100%" stop-color="hsl(${hue2},60%,15%)"/></linearGradient></defs><rect fill="url(#g)" width="400" height="500"/><text x="50%" y="45%" text-anchor="middle" fill="rgba(255,255,255,0.1)" font-family="Arial" font-size="160" font-weight="900">${title.charAt(0).toUpperCase()}</text><text x="50%" y="58%" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial" font-size="20" font-weight="700">${title.substring(0,14).toUpperCase()}</text></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function formatSize(b) {
  if (!b) return '';
  const k = 1024, s = ['B','KB','MB','GB'], i = Math.floor(Math.log(b)/Math.log(k));
  return parseFloat((b/Math.pow(k,i)).toFixed(1)) + ' ' + s[i];
}

function isNew(date) {
  return (new Date() - new Date(date)) < 14 * 24 * 60 * 60 * 1000;
}

function renderSeries(list) {
  const grid = document.getElementById('seriesGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="empty-icon">📚</div><h3>Aucune serie disponible</h3><p>Reviens plus tard ou contacte l administrateur.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(s => {
    const cover = generateCover(s.title, s.id);
    const newBadge = isNew(s.uploaded_at) ? `<span class="cover-badge">NEW</span>` : '';
    const views = s.views || 0;
    return `
      <div class="series-card" onclick="openModal('${s.id}')">
        <div class="cover-wrap">
          <img class="cover-img" src="${cover}" alt="${s.title}">
          <div class="cover-overlay"></div>
          ${newBadge}
          <span class="cover-rating">⭐ ${views}</span>
          <button class="read-btn">📖 Lire</button>
        </div>
        <div class="card-info">
          <div class="card-title">${s.title}</div>
          <div class="card-meta">
            <span class="card-chapters">${formatSize(s.size)} • PDF</span>
            <span class="card-status status-ongoing">En ligne</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function loadSeries() {
  try {
    const { data, error } = await supabase.from('pdfs').select('*').order('uploaded_at', {ascending:false});
    if (error) throw error;
    allSeries = data || [];
    renderSeries(allSeries);
  } catch(e) {
    document.getElementById('seriesGrid').innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="empty-icon">⚠️</div><h3>Erreur de connexion</h3><p>Verifie la configuration Supabase.</p></div>`;
  }
}

window.filterSeries = function(type) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (type === 'all') renderSeries(allSeries);
  else if (type === 'new') renderSeries(allSeries.filter(s => isNew(s.uploaded_at)));
  else if (type === 'popular') renderSeries([...allSeries].sort((a,b) => (b.views||0) - (a.views||0)));
};

document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderSeries(allSeries.filter(s => (s.title||'').toLowerCase().includes(q) || (s.description||'').toLowerCase().includes(q)));
});

window.openModal = function(id) {
  const s = allSeries.find(x => x.id === id);
  if (!s) return;
  document.getElementById('modalImg').src = generateCover(s.title, s.id);
  document.getElementById('modalTitle').textContent = s.title;
  document.getElementById('modalDesc').textContent = s.description || 'Aucune description disponible pour cette serie.';
  document.getElementById('modalRead').href = s.public_url;
  document.getElementById('modal').classList.add('active');
};
window.closeModal = function(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('active');
  }
};

loadSeries();
</script>
</body>
</html>
